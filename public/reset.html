<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0a0d0b"><link rel="stylesheet" href="style.css"></head>
<body><main style="max-width:420px;padding-top:12vh">
  <div class="logo" style="margin:0 0 20px;width:50px;height:50px"><svg viewBox="0 0 24 24" style="width:24px;height:24px"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11.4 11.4 0 003.6.57 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1z"/></svg></div>
  <h1 style="margin:0 0 6px">Choose a new password</h1><p class="muted" style="margin:0 0 22px">At least 8 characters.</p>
  <form id="f" style="display:grid;gap:12px">
    <input name="password" type="password" placeholder="New password" required minlength="8" autocomplete="new-password">
    <input name="confirm" type="password" placeholder="Repeat new password" required minlength="8" autocomplete="new-password">
    <button class="primary" style="justify-content:center;padding:14px">Save new password</button>
    <a href="login.html" class="muted" style="font-size:13.5px;text-decoration:none">← Back to log in</a>
  </form>
</main>
<script src="config.js"></script><script src="app.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token');
if (!token) toast('This reset link is incomplete. Request a new one from the login page.', 'error');
$('#f').onsubmit = async e => {
  e.preventDefault();
  const { password, confirm } = Object.fromEntries(new FormData(e.target));
  if (password !== confirm) return toast("The two passwords don't match", 'error');
  const btn = e.submitter; btn.disabled = true;
  try {
    const r = await api('/api/auth/reset', { method: 'POST', body: JSON.stringify({ token, password }) });
    store.set('orderly_token', r.token); store.set('orderly_flash', 'Password updated. You are logged in.');
    location.href = 'dashboard.html';
  } catch (err) { toast(err.message, 'error'); btn.disabled = false; }
};
</script></body></html>
